<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NTA JEE Main 2026</title>

<style>
body {font-family: Arial; background:#e9eef3;}
.box {
  width:320px; margin:100px auto; padding:20px;
  background:white; border-radius:10px;
  box-shadow:0 0 10px gray;
}
h2 {text-align:center; color:#003366;}
input {width:100%; padding:10px; margin:10px 0;}
button {
  width:100%; padding:10px;
  background:#003366; color:white;
  border:none; cursor:pointer;
}
.note {color:red; text-align:center; font-size:13px;}

/* Loading Screen */
#loading {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:white;
  justify-content:center;
  align-items:center;
  font-size:20px;
}
</style>
</head>

<body>

<div class="box">
<h2>National Testing Agency</h2>
<h3 style="text-align:center;">JEE Main 2026 Result</h3>

<input type="text" id="app" placeholder="Application Number">
<input type="date" id="dob">

<button onclick="login()">Submit</button>
</div>

<div id="loading">Checking Result... ⏳</div>

<script>
function login(){
let app = document.getElementById("app").value;
let dob = document.getElementById("dob").value;

if(app=="260320014700" && dob=="2007-07-12"){
  document.querySelector(".box").style.display="none";
  document.getElementById("loading").style.display="flex";

  setTimeout(()=>{
    window.location.href="result.html";
  },2000);
}else{
  alert("Invalid Details");
}
}
</script>

</body>
</html>
